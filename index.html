<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>শিক্ষা ও মেধা যাচাই প্রতিযোগিতা</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b2a4a 0%, #1b4a7a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 16px;
            margin: 0;
            /* Prevent pull-to-refresh and overscroll */
            overscroll-behavior: none;
            touch-action: none;
        }

        .main-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(3px);
            padding: 30px 20px 40px;
            border-radius: 60px 20px 60px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.15);
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
            letter-spacing: 1px;
            word-break: break-word;
        }
        .subhead {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 4px;
            margin-bottom: 20px;
            font-weight: 300;
        }

        /* স্পিন হুইল কনটেইনার */
        .wheel-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 10px auto 20px;
        }

        @media (min-width: 480px) {
            .wheel-wrapper {
                width: 300px;
                height: 300px;
            }
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 32px solid #ffdd00;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
            z-index: 10;
        }
        .pointer::after {
            content: "▼";
            position: absolute;
            top: -38px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #ffdd00;
            opacity: 0.7;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #f5f5f5;
            box-shadow: 0 0 0 6px #1e3c72, 0 12px 28px rgba(0,0,0,0.7);
            position: relative;
            transition: transform 4.5s cubic-bezier(0.12, 0.91, 0.20, 0.99);
            background: conic-gradient(
                #ff5722 0deg 60deg,
                #4caf50 60deg 120deg,
                #2196f3 120deg 180deg,
                #9c27b0 180deg 240deg,
                #ff9800 240deg 300deg,
                #e91e63 300deg 360deg
            );
        }

        .spin-btn {
            padding: 14px 40px;
            font-size: 1.3rem;
            font-weight: 800;
            color: #1e3c72;
            background: #ffd54f;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #b47c2e, 0 10px 20px rgba(0,0,0,0.3);
            transition: 0.08s linear;
            letter-spacing: 2px;
            margin-top: 8px;
            touch-action: manipulation;
        }
        .spin-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #b47c2e;
        }
        .spin-btn:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #b47c2e;
            pointer-events: none;
        }

        /* উইনিং পপ-আপ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-card {
            background: #ffffff;
            color: #1a1a2c;
            padding: 30px 20px 25px;
            border-radius: 40px 12px 40px 12px;
            text-align: center;
            max-width: 340px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            border: 2px solid #ffd700;
        }
        .modal-card h2 {
            font-size: 2rem;
            font-weight: 800;
            color: #2e7d32;
        }
        .modal-card .prize-name {
            font-size: 2.4rem;
            font-weight: 900;
            background: linear-gradient(45deg, #e91e63, #ff9800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 10px 0;
        }
        .action-btn {
            margin-top: 18px;
            padding: 12px 36px;
            background: #0d47a1;
            color: #fff;
            border: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 0 #072a5e;
            transition: 0.06s linear;
            touch-action: manipulation;
        }
        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #072a5e;
        }

        /* ফুল-স্কিন সাদা পেজ (প্র্যাঙ্ক) */
        #whitePage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }
        #whitePage .prank-text {
            font-size: 2.2rem;
            color: #111;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,0,0,0.2);
        }
        #whitePage .prank-sub {
            color: #333;
            margin-top: 10px;
            font-size: 1.2rem;
        }
        .hidden-audio {
            display: none;
        }

        /* ছোট স্ক্রিনে আরো ভালো */
        @media (max-width: 400px) {
            .main-container { padding: 20px 12px; }
            h1 { font-size: 1.5rem; }
            .wheel-wrapper { width: 220px; height: 220px; }
        }
    </style>
</head>
<body>

    <div class="main-container" id="mainView">
        <h1>🎓 অনলাইন কুইজ ও লটারি</h1>
        <p class="subhead">স্পিন চাপুন এবং পুরস্কার জিতে নিন!</p>

        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <div class="wheel" id="wheel"></div>
        </div>

        <button class="spin-btn" id="spinBtn">▶ SPIN</button>
        <p style="margin-top: 14px; font-size: 0.8rem; opacity: 0.7;">💡 প্রতিটি স্পিনে একটি পুরস্কার নির্ধারিত</p>
    </div>

    <!-- পপ-আপ মডাল -->
    <div class="modal-overlay" id="winModal">
        <div class="modal-card">
            <h2>🎉 অভিনন্দন!</h2>
            <p style="font-size: 1.1rem;">আপনি জিতে নিয়েছেন:</p>
            <div class="prize-name">iPhone 13</div>
            <div style="font-size: 1.8rem; margin: 6px 0;">📱</div>
            <button class="action-btn" id="nextPageBtn">এগিয়ে যান →</button>
        </div>
    </div>

    <!-- প্র্যাঙ্ক সাদা পেজ (সাউন্ড সহ) -->
    <div id="whitePage">
        <div class="prank-text">📢 পুরস্কার দাবি করুন!</div>
        <div class="prank-sub">আপনার ডিভাইসটি এখন নিরাপদ মোডে আছে</div>
        <div style="margin-top: 30px; font-size: 3rem;">🎁</div>
        <div style="margin-top: 20px; color: #999; font-size: 0.9rem;">(ভলিউম চেক করুন)</div>
        <!-- অডিও ট্র্যাক লুপ -->
        <audio id="prankAudio" loop>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            আপনার ব্রাউজার অডিও সাপোর্ট করে না।
        </audio>
    </div>

    <script>
        (function() {
            // ============================================================
            // 1. DISABLE BACK BUTTON (history)
            // ============================================================
            window.addEventListener('load', function() {
                // Push a dummy state so back button does nothing
                history.pushState(null, null, location.href);
                window.addEventListener('popstate', function(event) {
                    history.pushState(null, null, location.href);
                });
            });

            // ============================================================
            // 2. DISABLE HOME BUTTON (via 'beforeunload' & visibility)
            //    কিছু ব্রাউজারে home button সরাসরি block করা যায় না, 
            //    তবে page unload হলে আমরা সেটা আটকানোর চেষ্টা করি।
            // ============================================================
            window.addEventListener('beforeunload', function(e) {
                // This will show a confirmation dialog on some browsers
                // but not all (chrome ignores custom message)
                e.preventDefault();
                e.returnValue = '';
            });

            // ============================================================
            // 3. DISABLE MINIMIZE BUTTON (desktop) - আসলে minimize 
            //    বাটন সম্পূর্ণভাবে block করা যায় না, তবে resize ইভেন্টে 
            //    আমরা window আবার restore করতে পারি (ক্রুড)
            // ============================================================
            let minimizeBlocker = setInterval(function() {
                // যদি window minimized হয় (outerWidth/Height ছোট হয়ে যায়)
                // তবে আমরা window আবার restore করি
                if (window.outerWidth < 100 || window.outerHeight < 100) {
                    window.resizeTo(screen.availWidth, screen.availHeight);
                }
            }, 500);

            // ============================================================
            // 4. DISABLE VOLUME BUTTONS (keyboard & media keys)
            // ============================================================
            document.addEventListener('keydown', function(e) {
                // Volume up/down/mute keys
                if (e.key === 'VolumeUp' || e.key === 'VolumeDown' || e.key === 'VolumeMute') {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
                // Also block F5, Ctrl+R, etc (optional)
                if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
                    e.preventDefault();
                    return false;
                }
            });

            // ============================================================
            // 5. DISABLE CONTEXT MENU (right click)
            // ============================================================
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });

            // ============================================================
            // 6. DISABLE TOUCH GESTURES (pull-to-refresh, swipe back)
            // ============================================================
            document.addEventListener('touchmove', function(e) {
                // Prevent pull-to-refresh / overscroll
                e.preventDefault();
            }, { passive: false });

            // Also prevent default on touchstart to avoid any browser gestures
            document.addEventListener('touchstart', function(e) {
                // allow only if it's a button or interactive element
                let target = e.target;
                if (target.tagName === 'BUTTON' || target.closest('button')) {
                    return;
                }
                // otherwise block default to prevent back-swipe etc
                // but we need to be careful not to break scrolling inside modal etc.
                // Since we have no scrollable areas, we can block all.
                e.preventDefault();
            }, { passive: false });

            // ============================================================
            // 7. DISABLE KEYBOARD SHORTCUTS (Alt+Left, etc)
            // ============================================================
            document.addEventListener('keyup', function(e) {
                if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
                    e.preventDefault();
                    return false;
                }
                if (e.altKey && e.key === 'Home') {
                    e.preventDefault();
                    return false;
                }
            });

            // ============================================================
            // 8. PREVENT PAGE FROM GOING TO BACKGROUND (optional)
            //    কিছু ব্রাউজারে visibility change হলে আমরা পেজ ফোকাস ধরে রাখি
            // ============================================================
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    // page is hidden (user pressed home or minimize)
                    // try to bring focus back (works on some devices)
                    setTimeout(() => {
                        window.focus();
                    }, 100);
                }
            });

            // ============================================================
            // 9. SPIN WHEEL LOGIC (unchanged)
            // ============================================================
            const wheel = document.getElementById('wheel');
            const spinBtn = document.getElementById('spinBtn');
            const winModal = document.getElementById('winModal');
            const whitePage = document.getElementById('whitePage');
            const prankAudio = document.getElementById('prankAudio');
            const nextBtn = document.getElementById('nextPageBtn');

            let currentRotation = 0;
            let isSpinning = false;
            const TARGET_DEG = 330;

            function spinWheel() {
                if (isSpinning) return;
                isSpinning = true;
                spinBtn.disabled = true;

                const extraSpins = 5 + Math.floor(Math.random() * 3);
                const targetRotation = extraSpins * 360 + TARGET_DEG;
                currentRotation += targetRotation - (currentRotation % 360) + 360;
                wheel.style.transform = `rotate(${currentRotation}deg)`;

                setTimeout(() => {
                    winModal.style.display = 'flex';
                    isSpinning = false;
                    spinBtn.disabled = false;
                }, 4500);
            }

            spinBtn.addEventListener('click', spinWheel);

            function goToPrankPage() {
                winModal.style.display = 'none';
                whitePage.style.display = 'flex';

                prankAudio.volume = 1.0;
                prankAudio.loop = true;
                prankAudio.play().catch(err => {
                    console.warn('অডিও প্লে করা যায়নি:', err);
                });

                document.body.style.overflow = 'hidden';
                // Also try to keep focus
                window.focus();
            }

            nextBtn.addEventListener('click', goToPrankPage);

            // Space key to spin
            document.addEventListener('keydown', function(e) {
                if (e.code === 'Space' && !winModal.style.display.includes('flex') && whitePage.style.display !== 'flex') {
                    e.preventDefault();
                    spinWheel();
                }
            });

            // Audio resume on click
            document.addEventListener('click', function initAudio() {
                if (prankAudio.paused && whitePage.style.display === 'flex') {
                    prankAudio.play().catch(() => {});
                }
            }, { once: true });

            whitePage.addEventListener('click', function() {
                if (prankAudio.paused) {
                    prankAudio.play().catch(() => {});
                }
            });

            // ============================================================
            // 10. PREVENT CLOSE / MINIMIZE via keyboard (Alt+F4, Ctrl+W)
            // ============================================================
            document.addEventListener('keydown', function(e) {
                if (e.altKey && e.key === 'F4') {
                    e.preventDefault();
                    return false;
                }
                if (e.ctrlKey && e.key === 'w') {
                    e.preventDefault();
                    return false;
                }
                if (e.ctrlKey && e.key === 'q') {
                    e.preventDefault();
                    return false;
                }
            });

            // ============================================================
            // 11. BLOCK DEVICE BACK GESTURE (Android)
            // ============================================================
            // For Android Chrome, we can use history API
            history.pushState(null, null, location.href);
            window.addEventListener('popstate', function() {
                history.pushState(null, null, location.href);
            });

            // Also block the back button via 'beforeunload' 
            // (some browsers show a prompt, which is good)

            console.log('🎡 স্পিন হুইল প্রস্তুত! (সমস্ত বাটন ডিসেবল করা হয়েছে)');
        })();
    </script>
</body>
</html>
