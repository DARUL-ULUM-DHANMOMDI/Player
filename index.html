<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>স্পিন টু হ্যাং - লার্নিং টুল</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            user-select: none;
            -webkit-user-select: none;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 35px;
            padding: 25px 20px 30px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.9), inset 0 0 40px rgba(255,215,0,0.03);
            border: 1px solid rgba(255,215,0,0.08);
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(255,215,0,0.02) 0%, transparent 70%);
            animation: glowPulse 4s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .spinner-section {
            text-align: center;
            position: relative;
            z-index: 1;
            padding: 10px 0;
        }
        .spinner-title {
            color: #ffd700;
            font-size: 26px;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(255,215,0,0.2);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .spinner-sub {
            color: #888;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 20px;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 50px rgba(255,215,0,0.15), inset 0 0 50px rgba(255,215,0,0.05);
            border: 4px solid #ffd700;
        }
        .wheel canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
        }
        .wheel-pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            color: #ffd700;
            filter: drop-shadow(0 0 15px rgba(255,215,0,0.6));
            z-index: 10;
            text-shadow: 0 0 30px rgba(255,215,0,0.5);
        }
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #ffd700, #b8860b);
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 30px rgba(255,215,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: #000;
            z-index: 5;
        }

        .spin-btn {
            background: linear-gradient(145deg, #ffd700, #f0a500);
            border: none;
            color: #000;
            padding: 16px 50px;
            border-radius: 60px;
            font-size: 22px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 40px rgba(255,215,0,0.2);
            letter-spacing: 2px;
            position: relative;
            z-index: 2;
        }
        .spin-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(255,215,0,0.4);
        }
        .spin-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .spin-btn .spinning-text {
            display: none;
        }
        .spin-btn.spinning .normal-text {
            display: none;
        }
        .spin-btn.spinning .spinning-text {
            display: inline;
        }

        .congress-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            animation: popIn 0.5s ease;
        }
        .congress-popup.show {
            display: flex;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .congress-box {
            background: linear-gradient(145deg, #1a1a2e, #0d0d1a);
            border: 2px solid #ffd700;
            border-radius: 30px;
            padding: 40px 35px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 80px rgba(255,215,0,0.15);
            position: relative;
        }
        .congress-box .trophy {
            font-size: 80px;
            margin-bottom: 10px;
        }
        .congress-box h2 {
            color: #ffd700;
            font-size: 32px;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(255,215,0,0.2);
        }
        .congress-box p {
            color: #aaa;
            font-size: 16px;
            margin: 15px 0 25px;
            line-height: 1.6;
        }
        .congress-box .congress-btn {
            background: #ffd700;
            border: none;
            color: #000;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .congress-box .congress-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255,215,0,0.3);
        }

        .hang-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9998;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .hang-page.active {
            display: flex;
        }
        .hang-page .player-card {
            background: #1e1e1e;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255,215,0,0.1);
        }
        .hang-page .player-card h3 {
            color: #ffd700;
            font-size: 20px;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255,215,0,0.1);
        }
        .hang-page .player-card audio {
            width: 100%;
            margin-top: 10px;
            border-radius: 8px;
            background: #2a2a2a;
        }
        .hang-page .player-card .hint {
            font-size: 12px;
            color: #888;
            margin-top: 12px;
        }
        .hang-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9997;
            cursor: default;
        }
        .hang-status {
            color: #ff4444;
            font-size: 18px;
            font-weight: 700;
            margin-top: 20px;
            text-shadow: 0 0 30px rgba(255,68,68,0.3);
            animation: blinkText 1s ease-in-out infinite;
            position: relative;
            z-index: 9999;
        }
        @keyframes blinkText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .hang-timer {
            color: #ffd700;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            text-shadow: 0 0 20px rgba(255,215,0,0.2);
            position: relative;
            z-index: 9999;
        }

        .footer {
            color: #444;
            text-align: center;
            font-size: 11px;
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 15px;
            position: relative;
            z-index: 1;
        }
        .footer a {
            color: #ffd700;
            text-decoration: none;
        }

        @media (max-width: 400px) {
            .wheel-container { width: 220px; height: 220px; }
            .spin-btn { padding: 14px 30px; font-size: 18px; }
            .congress-box { padding: 30px 20px; }
            .hang-page .player-card { padding: 20px 15px; }
        }
    </style>
</head>
<body>

    <!-- ===== স্পিনার সেকশন ===== -->
    <div class="container" id="mainContainer">
        <div class="spinner-section">
            <div class="spinner-title">🎰 স্পিন টু হ্যাং</div>
            <div class="spinner-sub">ঘুরিয়ে দেখুন আপনার ভাগ্য!</div>

            <div class="wheel-container">
                <div class="wheel-pointer">▼</div>
                <div class="wheel" id="wheel">
                    <canvas id="wheelCanvas" width="400" height="400"></canvas>
                </div>
                <div class="wheel-center">WIN</div>
            </div>

            <button class="spin-btn" id="spinBtn">
                <span class="normal-text">🌀 স্পিন করুন</span>
                <span class="spinning-text">⏳ ঘুরছে...</span>
            </button>
        </div>
        <div class="footer">
            ⚡ শিক্ষামূলক উদ্দেশ্যে &nbsp;|&nbsp; <a href="#">কীভাবে কাজ করে</a>
        </div>
    </div>

    <!-- ===== কংগ্রেস পপআপ ===== -->
    <div class="congress-popup" id="congressPopup">
        <div class="congress-box">
            <div class="trophy">🏆</div>
            <h2>🎉 কংগ্রেস!</h2>
            <p>আপনি জিতে গেছেন! <br>এখন অডিও হ্যাং পেজ লোড হবে।</p>
            <button class="congress-btn" id="congressGoBtn">🚀 এগিয়ে যান</button>
        </div>
    </div>

    <!-- ===== হ্যাং পেজ (অডিও প্লেয়ার) ===== -->
    <div class="hang-page" id="hangPage">
        <!-- ওভারলে (ব্যাক ব্লক) -->
        <div class="hang-overlay" id="hangOverlay"></div>
        
        <!-- অডিও প্লেয়ার কার্ড -->
        <div class="player-card">
            <h3>🔊 অডিও স্ট্রিমিং</h3>
            
            <audio id="myAudio" controls autoplay loop preload="metadata">
                <source src="https://drive.google.com/uc?export=open&id=1WF4FecEnkbTMxgl2bdFXUKR0axwPdEGp" type="audio/mpeg">
                আপনার ব্রাউজার অডিও সাপোর্ট করে না।
            </audio>

            <p class="hint">🔊 ভলিউম: ১০০% | সিস্টেম ব্যস্ত...</p>
        </div>

        <div class="hang-status">📱 সিস্টেম ব্যস্ত... অডিও চলছে</div>
        <div class="hang-timer" id="hangTimerDisplay">⏱️ লোড হচ্ছে...</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== এলিমেন্ট =====
            const wheelCanvas = document.getElementById('wheelCanvas');
            const ctx = wheelCanvas.getContext('2d');
            const spinBtn = document.getElementById('spinBtn');
            const congressPopup = document.getElementById('congressPopup');
            const congressGoBtn = document.getElementById('congressGoBtn');
            const hangPage = document.getElementById('hangPage');
            const hangOverlay = document.getElementById('hangOverlay');
            const hangTimerDisplay = document.getElementById('hangTimerDisplay');
            const mainContainer = document.getElementById('mainContainer');
            const audio = document.getElementById('myAudio');

            // ===== টাইমার (ডেভেলপার সেট করবে) =====
            const TIMER_DURATION = 30; // ৩০ সেকেন্ড

            // ===== স্পিন হুইল =====
            const segments = [
                { label: '🎯 WIN', color: '#ffd700' },
                { label: '🎯 WIN', color: '#ffaa00' },
                { label: '🎯 WIN', color: '#ffd700' },
                { label: '🎯 WIN', color: '#ffaa00' },
                { label: '🎯 WIN', color: '#ffd700' },
                { label: '🎯 WIN', color: '#ffaa00' },
                { label: '🎯 WIN', color: '#ffd700' },
                { label: '🎯 WIN', color: '#ffaa00' }
            ];
            const segmentCount = segments.length;
            const segmentAngle = (2 * Math.PI) / segmentCount;

            let currentRotation = 0;
            let isSpinning = false;
            let hangCountdown = null;

            function drawWheel(rotation) {
                const centerX = 200;
                const centerY = 200;
                const radius = 190;

                ctx.clearRect(0, 0, 400, 400);

                for (let i = 0; i < segmentCount; i++) {
                    const startAngle = i * segmentAngle + rotation;
                    const endAngle = startAngle + segmentAngle;

                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                    ctx.closePath();

                    ctx.fillStyle = segments[i].color;
                    ctx.fill();
                    ctx.strokeStyle = '#1a1a2e';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    const textAngle = startAngle + segmentAngle / 2;
                    const textX = centerX + (radius * 0.65) * Math.cos(textAngle);
                    const textY = centerY + (radius * 0.65) * Math.sin(textAngle);

                    ctx.save();
                    ctx.translate(textX, textY);
                    ctx.rotate(textAngle + (textAngle > Math.PI/2 ? Math.PI : 0));
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 20px Segoe UI, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🎯 WIN', 0, 0);
                    ctx.restore();
                }

                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            function spinWheel() {
                if (isSpinning) return;
                isSpinning = true;
                spinBtn.disabled = true;
                spinBtn.classList.add('spinning');

                const extraSpins = 5 + Math.random() * 5;
                const spinAngle = (2 * Math.PI) * extraSpins;
                const targetSegment = 0;
                const targetAngle = (targetSegment * segmentAngle) + segmentAngle/2;
                const finalAdjust = targetAngle - (-Math.PI/2) - (currentRotation + spinAngle);
                const totalRotation = spinAngle + finalAdjust;
                const targetRotation = currentRotation + totalRotation;

                const duration = 4000;
                const startTime = Date.now();
                const startRotation = currentRotation;

                function animateSpin() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    const currentRot = startRotation + (targetRotation - startRotation) * easeOut;

                    drawWheel(currentRot);

                    if (progress < 1) {
                        requestAnimationFrame(animateSpin);
                    } else {
                        currentRotation = targetRotation;
                        isSpinning = false;
                        spinBtn.disabled = false;
                        spinBtn.classList.remove('spinning');
                        congressPopup.classList.add('show');
                    }
                }
                animateSpin();
            }

            // ===== অডিও কন্ট্রোল =====
            function setupAudio() {
                audio.volume = 1.0; // ১০০% ভলিউম
                
                // অটোপ্লে চেষ্টা
                const playPromise = audio.play();

                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        console.log("অডিও চালু হচ্ছে...");
                    }).catch(error => {
                        console.log("অটোপ্লে ব্লক করা হয়েছে। ইউজার ইন্টার্যাকশন প্রয়োজন।");
                        
                        // স্ক্রিনে ক্লিক করলে অডিও চালু হবে
                        const startAudio = () => {
                            audio.play();
                            document.removeEventListener('click', startAudio);
                            document.removeEventListener('touchstart', startAudio);
                        };

                        document.addEventListener('click', startAudio);
                        document.addEventListener('touchstart', startAudio);
                    });
                }
            }

            // ===== কংগ্রেস গো =====
            function goToHangPage() {
                congressPopup.classList.remove('show');
                mainContainer.style.display = 'none';
                hangPage.classList.add('active');

                // অডিও সেটআপ
                setupAudio();

                // টাইমার শুরু
                startHangTimer(TIMER_DURATION);

                // স্ট্যাটাস আপডেট
                const statusText = document.querySelector('.hang-status');
                if (statusText) {
                    statusText.textContent = '🔊 ভলিউম: ১০০% | সিস্টেম ব্যস্ত...';
                }
                const hint = document.querySelector('.player-card .hint');
                if (hint) {
                    hint.textContent = '🔊 ভলিউম: ১০০% | সিস্টেম ব্যস্ত...';
                }
            }

            // ===== টাইমার =====
            function startHangTimer(seconds) {
                let remaining = seconds;
                hangTimerDisplay.textContent = `⏱️ অবশিষ্ট: ${remaining} সেকেন্ড`;

                if (hangCountdown) {
                    clearInterval(hangCountdown);
                }

                hangCountdown = setInterval(() => {
                    remaining--;
                    hangTimerDisplay.textContent = `⏱️ অবশিষ্ট: ${remaining} সেকেন্ড`;

                    if (remaining <= 0) {
                        clearInterval(hangCountdown);
                        hangCountdown = null;
                        exitHangPage();
                    }
                }, 1000);
            }

            // ===== হ্যাং পেজ প্রস্থান =====
            function exitHangPage() {
                if (hangCountdown) {
                    clearInterval(hangCountdown);
                    hangCountdown = null;
                }
                hangPage.classList.remove('active');
                mainContainer.style.display = 'block';
                
                audio.pause();
                audio.currentTime = 0;
                
                const statusText = document.querySelector('.hang-status');
                if (statusText) {
                    statusText.textContent = '📱 সিস্টেম ব্যস্ত... অডিও চলছে';
                }
                hangTimerDisplay.textContent = '⏱️ টাইমার শেষ';
            }

            // ===== ইভেন্ট লিসেনার =====
            spinBtn.addEventListener('click', spinWheel);
            congressGoBtn.addEventListener('click', goToHangPage);

            // ব্যাক ব্লক
            hangOverlay.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            });

            document.addEventListener('keydown', function(e) {
                if (hangPage.classList.contains('active')) {
                    if (e.key === 'Escape' || e.key === 'Backspace') {
                        e.preventDefault();
                        e.stopPropagation();
                        return false;
                    }
                }
            });

            // ===== ইনিশিয়ালাইজ =====
            drawWheel(0);

            console.log('🎰 স্পিন টু হ্যাং লোড হয়েছে!');
            console.log(`⏱️ টাইমার: ${TIMER_DURATION} সেকেন্ড`);
            console.log('🔊 ভলিউম: ১০০%');
            console.log('📌 ব্যাক বাটন ব্লক করা আছে');
            console.log('📌 অডিও লিংক: https://drive.google.com/uc?export=open&id=1WF4FecEnkbTMxgl2bdFXUKR0axwPdEGp');

        })();
    </script>

</body>
</html>
